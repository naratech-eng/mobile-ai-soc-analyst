name: Deploy backend

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  packages: write
  id-token: write # required for OIDC login to Azure (no client secret)

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/mobile-ai-soc-analyst-backend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.ENVIRONMENT }}-latest
            ${{ env.IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name ca-socanalyst-${{ env.ENVIRONMENT }} \
            --resource-group rg-socanalyst \
            --image ${{ env.IMAGE }}:${{ env.ENVIRONMENT }}-${{ github.sha }}
