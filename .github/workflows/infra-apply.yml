name: Terraform apply (manual)

# Deliberately NOT triggered on push — infra changes (new resources,
# resized apps) should be a conscious action, not a side effect of an
# unrelated code push. Run this from the Actions tab when you actually
# want to reconcile Azure with infra/*.tf.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "terraform action"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write # required for OIDC login to Azure (no client secret)

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      - name: Terraform ${{ inputs.action }}
        env:
          TF_VAR_ghcr_owner: ${{ github.repository_owner }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_backend_api_key_dev: ${{ secrets.BACKEND_API_KEY_DEV }}
          TF_VAR_backend_api_key_prod: ${{ secrets.BACKEND_API_KEY_PROD }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          if [ "${{ inputs.action }}" = "apply" ]; then
            terraform apply -auto-approve
          else
            terraform plan
          fi
