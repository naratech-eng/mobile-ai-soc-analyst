[project]
name = "mobile-ai-soc-analyst-backend"
version = "0.1.0"
description = "FastAPI + Pydantic AI detection backend for the Mobile AI SOC Analyst project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "pydantic-ai>=0.0.13",
    "pydantic-settings>=2.3",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
